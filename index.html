<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>
    
<main>

    <section  aria-labelledby="titulo-filtros">

        <h2 id="titulo-filtros">Busca e filtros</h2>

    <form>

    <label for="busca">Buscar tarefa:</label>

    <input
        type="search"
        id="busca"
        name="busca"
        placeholder="Digite o título da tarefa"
    >


    <fieldset>

        <legend>Status</legend>


        <div class="opcao-radio">

            <input
                type="radio"
                id="status-todos"
                name="status"
                value="todos"
                checked
            >

            <label for="status-todos">
                Todos
            </label>

        </div>


        <div class="opcao-radio">

            <input
                type="radio"
                id="fazer"
                name="status"
                value="a-fazer"
            >

            <label for="fazer">
                A fazer
            </label>

        </div>


        <div class="opcao-radio">

            <input
                type="radio"
                id="andamento"
                name="status"
                value="em-andamento"
            >

            <label for="andamento">
                Em andamento
            </label>

        </div>


        <div class="opcao-radio">

            <input
                type="radio"
                id="revisao"
                name="status"
                value="em-revisao"
            >

            <label for="revisao">
                Em revisão
            </label>

        </div>


        <div class="opcao-radio">

            <input
                type="radio"
                id="concluido"
                name="status"
                value="concluida"
            >

            <label for="concluido">
                Concluído
            </label>

        </div>

    </fieldset>


    <fieldset>

        <legend>Prioridade</legend>


        <div class="opcao-radio">

            <input
                type="radio"
                id="prioridade-todas"
                name="prioridade"
                value="todas"
                checked
            >

            <label for="prioridade-todas">
                Todas
            </label>

        </div>


        <div class="opcao-radio">

            <input
                type="radio"
                id="baixa"
                name="prioridade"
                value="baixa"
            >

            <label for="baixa">
                Baixa
            </label>

        </div>


        <div class="opcao-radio">

            <input
                type="radio"
                id="media"
                name="prioridade"
                value="media"
            >

            <label for="media">
                Média
            </label>

        </div>


        <div class="opcao-radio">

            <input
                type="radio"
                id="alta"
                name="prioridade"
                value="alta"
            >

            <label for="alta">
                Alta
            </label>

        </div>

    </fieldset>


    <label for="ordenacao">
        Ordenar por:
    </label>

    <select id="ordenacao" name="ordenacao">

        <option value="padrao">
            Padrão
        </option>

        <option value="prazo">
            Prazo
        </option>

    </select>


    <button
        type="button"
        id="limpar-filtros"
    >
        Limpar filtros
    </button>

</form>

    </section>

     <div id="status" role="status" aria-live="polite"></div>

    <h2>Quadro de tarefas</h2>
    <section class="quadro-tarefas">
        

        <section class="status-a-fazer" data-lista-status="a-fazer" aria-labelledby="titulo-afazer">
            <h3 id="titulo-afazer">A fazer</h3>

            <ul>

            </ul>

        </section>

        <section class="status-andamento" data-lista-status="em-andamento" aria-labelledby="titulo-andamento">
            <h3 id="titulo-andamento">Em andamento</h3>

            <ul>

            </ul>


        </section>

        <section class="status-revisao" data-lista-status="em-revisao" aria-labelledby="titulo-revisao">
            <h3 id="titulo-revisao">Em revisao</h3>

            <ul>

            </ul>


        </section>

        <section 
        class="status-concluido" data-lista-status="concluida" aria-labelledby="titulo-concluido">
            <h3 id="titulo-concluido">concluido</h3>

            <ul>

            </ul>


        </section>

    </section>

    

</main>

<footer>
    <p>Lucas Cardoso Marinho</p>
    <p>Disciplina: Desenvolvimento Frontend - 2026.2</p>
</footer>

<script type="module" src="./js/app.js"></script>
</body>
</html>
