<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
</head>
<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>
    
<main>

    <section  aria-labelledby="titulo-filtros">

        <h2 id="titulo-filtros">Busca e filtros</h2>

    <form>
        <label for="busca">buscar tarefa:</label>
        <input type="search" id="busca" name="busca">
    

    <fieldset>

        <legend>Status</legend>

        <input type="radio" id="fazer" name="status">
        <label for="fazer">A fazer</label>

        <input type="radio" id="andamento" name="status">
        <label for="andamento">em andamento</label>

        <input type="radio" id="revisao" name="status">
        <label for="revisao">em revisao</label>

        <input type="radio" id="concluido" name="status">
        <label for="concluido">concluido</label>
        
    </fieldset>

    

    </form>

    </section>

    

    

</main>




</body>
</html>
